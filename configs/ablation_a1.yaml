# Ablation A-1 (docs/DECISIONS.md D-38, declared before any result): MobileNetV3-Small FROM SCRATCH at lr 3e-4.
# Identical to configs/mobilenetv3_small_scratch.yaml except `experiment` and `lr`; separates ImageNet initialisation from the learning rate.
protocol_version: 2        # fixed epochs, no early stopping (docs/DECISIONS.md D-26)
experiment: a1_mobilenetv3_small_scratch_lr3e4
model: {name: mobilenetv3_small, pretrained: false}
data:
  cache: data/cache
  floor_db: -80.0          # docs/DECISIONS.md D-15
train:
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 64
  max_epochs: 30           # cosine decays over exactly these epochs
  warmup_epochs: 2
  early_stopping: false    # always run all epochs; best-val-accuracy checkpoint is evaluated on test once
  label_smoothing: 0.1
  amp: none                # none | fp16 | bf16 ; see docs/DECISIONS.md D-11
  seed: 42
specaugment: {freq_masks: 2, freq_width: 16, time_masks: 2, time_width: 20}
